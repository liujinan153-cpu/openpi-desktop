name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run licenses:audit

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare embedded Python runtime
        run: node scripts/prepare-python-runtime.mjs
      - name: Build Windows artifacts (no paid-model E2E)
        run: node scripts/dist.mjs --fast
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        with:
          name: openpi-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/OpenPi Desktop Setup *.exe
            dist/OpenPi Desktop Setup *.exe.blockmap
            dist/OpenPi Desktop *.exe
            dist/latest.yml
